name: GitHub-only review

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gettext \
            libxml2-utils \
            locales \
            nodejs \
            php-cli \
            php-xml \
            shellcheck
          sudo locale-gen ru_RU.UTF-8

          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          chmod 0755 "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run repository checks
        env:
          LANG: ru_RU.UTF-8
          LC_ALL: ru_RU.UTF-8
        run: tools/github-checks.sh

      - name: Publish evidence scope
        if: always()
        env:
          CHECK_RESULT: ${{ job.status }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo '## GitHub-only review evidence'
            echo
            echo "- Result: \`$CHECK_RESULT\`"
            echo "- Reviewed revision: \`$REVIEWED_SHA\`"
            echo '- Runner: GitHub-hosted Ubuntu 24.04'
            echo '- Covered: positive and negative PHP lint, workflow policy, PHP/Python/JavaScript/shell/XML syntax, model tests, UI state transitions, deploy health contracts, translations, generated-file consistency.'
            echo '- Not covered: installation on TING/OPNsense, firewall reload, packet flow, shaping speed, or rollback on a real appliance.'
          } >> "$GITHUB_STEP_SUMMARY"
